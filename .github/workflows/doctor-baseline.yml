name: Doctor unchanged-main baseline
on:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6ec27efb48fd7aeaf423a8b490c2c63fd76871c0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git rev-parse HEAD
      - run: npm ci
      - run: npm run build
      - name: Reproduce unchanged doctor tests (expected failures, issue 4)
        run: node --test dist/test/cli/doctor.test.js
